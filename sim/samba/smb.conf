# File: smb.conf
# Description: Minimal smbd configuration for the Smart Locker Samba stand-in.
#              Alternative to docker-compose.yml when running smbd directly on
#              the host (no Docker required).
# Project: smart_locker/sim/samba
# Notes:
#   1. Install smbd:   sudo apt-get install samba    (Debian/Ubuntu)
#   2. Replace /PATH/TO/sim/samba/share-data with the absolute path to this
#      repo's sim/samba/share-data/ directory.
#   3. Add a Samba user:
#        sudo adduser --system --no-create-home simuser   # if not already a system user
#        sudo smbpasswd -a simuser                        # set password to: simpass
#        sudo smbpasswd -e simuser
#   4. Copy this file to /etc/samba/smb.conf and restart:
#        sudo cp sim/samba/smb.conf /etc/samba/smb.conf
#        sudo systemctl restart smbd
#   5. Place the sample workbook at:
#        sim/samba/share-data/Messmittelliste.xlsx
#   6. From inside the QEMU guest, mount at /mnt/locker:
#        sudo mount -t cifs //10.0.2.2/locker /mnt/locker \
#             -o username=simuser,password=simpass,vers=3.0,uid=locker,gid=locker
#      (10.0.2.2 = QEMU user-net host gateway; use the real host IP in other setups)

[global]
   workgroup = WORKGROUP
   server string = Smart Locker Sim Samba
   log level = 1
   log file = /var/log/samba/smb.log
   max log size = 5000

   # Security: local logins only; not suitable for production
   security = user
   map to guest = Never

   # SMB3 only — matches the deploy/mount/fstab.snippet default (vers=3.0)
   server min protocol = SMB3
   server max protocol = SMB3

[locker]
   comment = Smart Locker M: share stand-in
   path = /PATH/TO/sim/samba/share-data
   valid users = simuser
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775
   # Prevent .DS_Store and thumbs.db clutter
   veto files = /.DS_Store/Thumbs.db/
   delete veto files = yes
